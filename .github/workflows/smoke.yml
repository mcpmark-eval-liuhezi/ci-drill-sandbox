name: smoke-test

on:
  push:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Print smoke lines
        run: |
          echo "Smoke test running."
          echo "Repo: ${GITHUB_REPOSITORY}"

      - name: Prepare artifact
        run: |
          echo "Smoke test passed for run ${GITHUB_RUN_ID} at $(date -u +"%Y-%m-%dT%H:%M:%SZ")" > smoke-output.txt

      - name: Upload smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: smoke-output.txt
